# .github/workflows/deploy.yml
# CI: valida tipos e build a cada push/PR. NÃO faz deploy — isso é feito pela
# integração nativa do Vercel com o GitHub (preview em PR/branch, produção
# em push na main). Não usa `prisma migrate deploy` porque este projeto
# aplica as migrations manualmente via SQL no Supabase (ver CLAUDE.md).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Verificação (tipos + build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos TypeScript
        run: npx tsc --noEmit

      # TODO: ainda há ~286 avisos de `any` pré-existentes no código — falhar
      # o CI por isso hoje bloquearia todo PR sem relação com o problema.
      # Mantido visível (roda e reporta) sem travar o pipeline até virem
      # limpos aos poucos.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Gerar Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build
        run: npm run build
        env:
          DATABASE_URL:                  ${{ secrets.DATABASE_URL }}
          DIRECT_URL:                    ${{ secrets.DIRECT_URL }}
          JWT_SECRET:                    ${{ secrets.JWT_SECRET }}
          JWT_SECRET_ADMIN:              ${{ secrets.JWT_SECRET_ADMIN }}
          NEXT_PUBLIC_SUPABASE_URL:      ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL:           ${{ secrets.NEXT_PUBLIC_APP_URL }}
          RESEND_API_KEY:                ${{ secrets.RESEND_API_KEY }}

  # ── Testes de ponta a ponta (Playwright) ──────────────────
  # Roda contra um banco falso (FAKE_DB=1, ver lib/fake-db-test.ts) — não
  # precisa de nenhum Secret real do Supabase, só de um JWT_SECRET
  # qualquer pra assinar o token de sessão. Independente do job acima:
  # roda em paralelo, não bloqueado pelos Secrets de produção.
  e2e:
    name: Testes E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Instalar navegador do Playwright
        run: npx playwright install --with-deps chromium

      - name: Rodar testes E2E
        run: npm run test:e2e
        env:
          JWT_SECRET:                    test-secret-apenas-para-ci-nao-e-usado-em-producao
          JWT_SECRET_ADMIN:              test-secret-apenas-para-ci-nao-e-usado-em-producao
          NEXT_PUBLIC_SUPABASE_URL:      https://exemplo-fake.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: chave-fake-nao-usada-com-fake-db
          NEXT_PUBLIC_APP_URL:           http://localhost:3100
          RESEND_API_KEY:                re_fake_nao_usada_com_fake_db

      - name: Publicar relatório do Playwright em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
